<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#1D2A23;--sub:#6F7B73;--line:#DCE2DA;--acc:#5F8672;--ok:#6B9A7C;--bad:#D64545;

:root[data-tskin="rose"]{--bg:#F6EEEA;--card:#FFFCFA;--ink:#3A2826;--sub:#8C746F;--line:#E9D8D1;--acc:#A8625F;--ok:#B07A72}
:root[data-tskin="blue"]{--bg:#E9EEF3;--card:#fff;--ink:#1E2935;--sub:#697686;--line:#D3DCE5;--acc:#4F6F8C;--ok:#6E8CA6}
:root[data-tskin="olive"]{--bg:#F5F1E1;--card:#FFFEF6;--ink:#2D2E1B;--sub:#7A795C;--line:#E3DEC2;--acc:#7A8450;--ok:#8E9A62}
:root[data-tskin="sky"]{--bg:#EAF4FB;--card:#fff;--ink:#12263A;--sub:#5A7086;--line:#CFE0EE;--acc:#1E88E5;--ok:#43A047}
:root[data-tskin="orange"]{--bg:#FFF4EC;--card:#fff;--ink:#3A2416;--sub:#8A6A55;--line:#F3DCC9;--acc:#F06A2A;--ok:#E89A3C}
:root[data-tskin="lavender"]{--bg:#F3F0FA;--card:#fff;--ink:#2A2340;--sub:#6F6889;--line:#E0DAF0;--acc:#7B5CD6;--ok:#9C7FE0}
:root[data-tskin="sakura"]{--bg:#FFF1F4;--card:#fff;--ink:#3B1F27;--sub:#8C6670;--line:#F6D5DE;--acc:#E5537A;--ok:#F08AA5}
:root[data-tskin="mono"]{--bg:#F4F4F4;--card:#fff;--ink:#111;--sub:#666;--line:#DDD;--acc:#222;--ok:#555}
:root[data-tskin="night"]{--bg:#14161A;--card:#1E2128;--ink:#ECEEF2;--sub:#9AA0AA;--line:#2C313A;--acc:#5BA8F5;--ok:#6CCB8C}
*{box-sizing:border-box}
html{scroll-padding-top:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC",-apple-system,"Microsoft JhengHei",sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:26px;margin:4px 2px 12px;font-weight:700}
h2{font-size:14px;margin:16px 2px 8px;color:var(--sub);font-weight:500}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}.late{color:var(--bad);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:6px 0;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2;font-weight:400}nav button.on{color:var(--acc);font-weight:700}
input,select,textarea,button.go{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical}
button.go{background:var(--acc);color:#fff;border:0;font-weight:700;cursor:pointer;width:auto;padding:9px 14px}
button.go.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button.go.q{background:var(--bg);color:var(--acc);border:1px solid var(--line);font-weight:600;padding:7px 10px;font-size:13px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.chip.v{background:#3F5A6B;color:#CDE5CF;border-color:transparent}
.chips.one{flex-wrap:nowrap;gap:4px}.chips.one .chip{padding:5px 8px;font-size:12px;white-space:nowrap}
.fs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.fs .chip{flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .w{grid-column:1/3}
.fl{display:block}.fl span{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.pill{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--sub)}.pill.y{background:var(--ok);color:#fff;border-color:transparent}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.x{border:0;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:0 4px}
.stk,#lfix{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,520px);z-index:7;background:var(--bg);display:flex;align-items:center;gap:10px;margin:0;padding:6px 52px 6px 14px;border-bottom:1px solid var(--line)}
#lfix{z-index:6;display:none;font-weight:700;font-size:16px;padding-top:10px;padding-bottom:10px}
.stkgap{height:46px}
.stk h1{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .back{margin:0;flex:none}
.stkl{position:sticky;top:0;z-index:6;background:var(--card);padding:6px 0}
.back{border:0;background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:4px}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:2px solid var(--line)}.tree>ul{border:0;padding:0}
.node{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:5px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.log{border-left:3px solid var(--line);padding:1px 0 1px 10px;margin:6px 0}
.note{font-size:12px;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.done{text-decoration:line-through;opacity:.5}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--line);cursor:pointer;display:block}
.add{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;color:var(--acc);font-size:28px;cursor:pointer}
.mini{display:flex;gap:4px;margin-top:4px}.mini .ph{width:52px;flex:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#lb img{max-width:100%;max-height:75%;border-radius:10px;object-fit:contain}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;z-index:15;display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal span{text-align:center;font-size:12px;color:var(--sub)}
.cal button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;padding:5px 0;cursor:pointer;line-height:1.2}
.cal button small{display:block;font-size:10px;color:var(--acc);min-height:12px}.cal button.on{background:var(--acc);color:#fff}.cal button.on small{color:#fff}.cal button.td{border-color:var(--acc)}
.mini{flex-wrap:wrap}.mini-add{width:52px;height:52px;aspect-ratio:auto;font-size:22px}
#app>.row:first-child{padding-right:44px}
#app>h1,#app>.row:first-child{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:10px;padding-bottom:8px;margin:-16px 0 6px}
#tipx{position:fixed;top:10px;right:56px;z-index:8}
#fab{position:fixed;top:10px;right:14px;z-index:8}
.fabb{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--acc);background:var(--card);color:var(--acc);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.fabp{position:absolute;right:0;top:42px;width:min(86vw,320px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.hl{border-left:6px solid #C58FA6;background:#F4E6EC}
.cal button.hl:not(.on){background:#EBD6DE;border-color:#C58FA6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hl{background:#3A2A32}:root:not([data-theme="light"]) .cal button.hl:not(.on){background:#4A3640}}
:root[data-theme="dark"] .hl{background:#3A2A32}:root[data-theme="dark"] .cal button.hl:not(.on){background:#4A3640}
input:not([type=checkbox]):not([type=file]):not([type=radio]),select{height:38px;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;line-height:1.2;text-align:left}
textarea{max-width:100%}
.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.row>*{min-width:0}.card{overflow-wrap:anywhere}
.stp{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-weight:700;cursor:pointer;padding:0;flex:none}
.stp.done{background:var(--acc);color:#fff;border-color:transparent}.stp.part{border-color:var(--acc);color:var(--acc)}.stp.sel{outline:2px solid var(--acc);outline-offset:2px}
.stp.mini{width:20px;height:20px;font-size:11px;cursor:default;display:inline-grid;place-items:center}
.an{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px}.an-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14px}.an-r{font-weight:400;color:var(--sub);font-size:12px;text-align:right}.an-s{cursor:pointer;color:var(--acc);font-weight:700;font-size:13px;margin-top:8px}.an-b{font-size:13px;line-height:1.65;margin-top:4px}.an .fl{margin-top:6px}
.wk{display:grid;grid-template-columns:26px repeat(7,1fr);font-size:11px}.wk .hd{text-align:center;padding:2px 0 4px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--sub);line-height:1.3}.wk .hd b{color:var(--ink);font-size:13px}.wk .hd.tdh b{background:var(--acc);color:#fff;border-radius:50%;display:inline-block;width:20px;line-height:20px}.wk .hr{color:var(--sub);font-size:9px;text-align:right;padding-right:3px;box-sizing:border-box;border-top:1px solid var(--line);margin-top:-1px;line-height:1}.wk .col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}.wk .col.tdc{background-color:rgba(127,150,120,.12)}.wk .ev{position:absolute;box-sizing:border-box;border-radius:5px;padding:1px 2px;font-size:10px;line-height:1.2;overflow:hidden;color:#fff;cursor:pointer;border:1px solid var(--card)}
.rail{position:fixed;left:max(3px,calc(50% - 258px));top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:4px}.rail button{width:34px;padding:7px 0;font:inherit;font-size:12px;line-height:1.1;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--acc);font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}.rail button:active{background:var(--acc);color:#fff}
input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
#authwrap{max-width:420px;margin:0 auto;padding:40px 16px}#authwrap a{color:var(--acc)}
.afl{display:block;margin-bottom:10px}.afl span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
</style>
</head>
<body>
<div id="auth"></div>
<div id="app"></div><nav id="nav"></nav><div id="lb"></div><div id="toast"></div><div id="fab"></div><div id="tipx"></div><div id="lfix"></div>
<script type="module" src="auth.js"></script>
<script type="text/plain" id="app-src">
let NDO=['直銷通路','336','直安超','四個換','五福臨門','層次圖','六個圈圈','月結獎金','加碼獎金','九種十八項','安麗小學','新人啟動六步驟','成功三要','海外旅遊','六不講'];
let MG=['健管班','形管班','創業班'];const TAGS=['線上運動','線上唱歌','團隊出遊','運動聚會','桌遊聚會'];
const iso=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())},addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)},today=()=>iso(new Date());
const dleft=s=>s?Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5):999;
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function newP(name,id){return{id,name,nannies:[],no:'',ig:'',line:'',nat:'台灣🇹🇼',age:'',gender:'',job:'',zodiac:'',blood:'',life:'',namology:'',mbti:'',live:'',family:'',live2:'',hobby:'',dream:'',money:'',joined:false,room:false,broke:false,attitude:'',met:today(),team:'',status:'',help:'',backer:'',up:0,mentor:{nanny:'',coach:'',teacher:''},camp:{},phone:false,mentorL:{},list:false,mg:{},ndo:{},every:false,courses:'',acts:[],photos:[],tags:{},next:addD(2),log:[]}}
const DEF={tab:'today',view:null,q:'',flt:'all',me:'我',people:[Object.assign(newP('示範：王小明',1),{joined:true,room:true,broke:true,job:'設計師',up:0,next:addD(-1),log:[{date:addD(-3),text:'聊了健康管理，對營養有興趣'}]}),Object.assign(newP('示範：林小姐',2),{job:'護理師',next:addD(0),status:'剛認識，約下週喝咖啡'})]};
let S=DEF;try{const r=localStorage.getItem('roster-v2');if(r)S=Object.assign({},DEF,JSON.parse(r))}catch(e){}
const CL={st:'☁︎ 連線中…',last:{},LT0:0,HAS0:false};try{CL.LT0=+localStorage.getItem('roster-t')||0;CL.HAS0=!!localStorage.getItem('roster-v2')}catch(e){}
const save=()=>{try{localStorage.setItem('roster-v2',JSON.stringify(S));localStorage.setItem('roster-t',String(Date.now()))}catch(e){}cloudQ()};
const P=id=>S.people.find(x=>x.id===id);
const WD=['日','一','二','三','四','五','六'];
S.six=S.six||{};S.six.mg=S.six.mg||MG.slice();S.six.ndo=S.six.ndo||NDO.slice();S.six.t=S.six.t||['拜三師','密切聯繫/電話通','列名單','管理班','NDO','每會必到'];MG=S.six.mg;NDO=S.six.ndo;S.plans=S.plans||{};S.cm=S.cm||today().slice(0,7);S.cf=null;S.side=S.side||[];S.lv='list';S.fb=S.fs=S.fl=S.fc='all';S.pn=null;S.watch=S.watch||'美蓁';S.promos=S.promos||[];S.groups=S.groups||groupSeed();S.cat=S.cat||catSeed();if((S.catV||0)<2){const cu=S.cat.find(x=>x.n==='自訂品項');S.cat=catSeed();if(cu&&cu.items.length)S.cat.push(cu);S.catV=2}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}S.obj=S.obj||[];S.meI=S.meI||{lv:'',note:''};S.av=S.av||'log';S.aq='';S.pkg=-1;if(S.myBd===undefined)S.myBd='1995-08-29';S.leaders=S.leaders||[];S.events=S.events||[];S.traits=S.traits||{};S.ndesc=S.ndesc||{};S.pd=today();
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const k=p.split('.');let a=o;while(k.length>1){const n=k.shift();a=a[n]=a[n]||{}}a[k[0]]=v};
function prog(p){const a=[...Object.values(p.mentor).map(Boolean),p.phone,p.list,...MG.map(k=>p.mg[k]),...NDO.map(k=>p.ndo[k]),p.every];return Math.round(a.filter(Boolean).length/a.length*100)}
const last=p=>p.log[0]?p.log[0].date:'';
const due=p=>{const n=dleft(p.next);return n<0?`<span class="late">逾期 ${-n} 天</span>`:n===0?'<b>今天</b>':p.next?`${n} 天後`:'未排'};
const pills=p=>[['broke','破題'],['room','進教室'],['joined','加入']].map(([k,n])=>`<span class="pill ${p[k]?'y':''}">${n}</span>`).join('');


const shiftD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const plan=()=>S.plans[S.pd]||(S.plans[S.pd]={ids:[],acts:{},done:{}});
function sug(p){
 const a=[];
 if(!p.joined&&!p.broke)a.push({k:'broke',t:'破題：了解需求與想法',path:'broke'});
 if(!p.joined&&p.broke&&!p.room)a.push({k:'room',t:'邀請進教室',path:'room'});
 if(!p.joined&&p.room)a.push({k:'join',t:'確認加入意願',path:'joined'});
 if(p.joined){
  const mm=[['nanny','保母'],['coach','教練'],['teacher','老師']].filter(([k])=>!p.mentor[k]).map(x=>x[1]);
  if(mm.length)a.push({k:'mentor',t:'拜三師：還缺'+mm.join('、')});
  if(!p.phone)a.push({k:'phone',t:'密切聯繫／電話通',path:'phone'});
  if(!p.list)a.push({k:'list',t:'協助列名單',path:'list'});
  MG.filter(k=>!p.mg[k]).slice(0,1).forEach(k=>a.push({k:'m'+k,t:'安排'+k,path:'mg.'+k}));
  NDO.filter(k=>!p.ndo[k]).slice(0,2).forEach(k=>a.push({k:'n'+k,t:'NDO：講解「'+k+'」',path:'ndo.'+k}));
  if(!p.every)a.push({k:'every',t:'提醒每會必到',path:'every'});
 }
 if(p.help)a.push({k:'help',t:'團隊支援：'+p.help});
 if(!p.log.length)a.push({k:'first',t:'還沒有跟進紀錄，聊完記一筆'});
 else{const g=-dleft(p.log[0].date);if(g>=7)a.push({k:'gap',t:'已 '+g+' 天沒聯絡'})}
 return a.slice(0,8);
}
function addToPlan(id){const pl=plan(),p=P(id);if(p&&!pl.ids.includes(id)){pl.ids.push(id);pl.acts[id]=sug(p)}}
function evNext(){const t0=today(),t1=addDs(t0,13),nw=new Date(),hm=pad2(nw.getHours())+':'+pad2(nw.getMinutes()),l=S.events.filter(e=>e.date>=t0&&e.date<=t1&&!(e.date===t0&&e.end&&e.end<=hm)).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));
 const row=e=>{const w=e.who.filter(P),sl=w.filter(id=>((e.inv||{})[id]||0)<0).length,dr=w.length-sl,dd=new Date(e.date+'T00:00:00');return `<div class="row" data-hev="${e.id}" style="padding:8px 0;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start"><div style="flex:none;text-align:center"><span class="pill">${+e.date.slice(5,7)}/${+e.date.slice(8)}（${WD[dd.getDay()]}）</span>${e.start?`<div class="sub" style="font-size:12px;margin-top:2px">${e.start}</div>`:''}</div><div class="sp" style="min-width:0"><b>${E(e.title)}</b> <span style="color:var(--acc);font-size:12px;white-space:nowrap">約 ${dr} 人／旁線 ${sl+(e.sw||[]).filter(id=>S.side.some(x=>x.id===id)).length} 人</span></div></div>`};

const IPROMPT='這是一張俱樂部的每月活動表照片：表格，每一格有日期和活動名稱，格子下方的藍色字是講師。請只擷取：(1) 每個活動的名稱；(2) 講師，也就是藍色字裡的姓名與級別（例如「林依瓊 F翡翠」），不要國別（台灣／大陸）；沒有藍色字就留空。紅色字的課（例如「形象管理班(一)」）也算活動，講師留空。不要放進活動名稱或講師的有：前導／主持／分享（這些只放進 crew）、俱樂部名稱（輕創業俱樂部、生涯規劃俱樂部）、最右欄的輪值組別、最上方的會場標題與地址。活動名稱若分成兩行，請合併成一個名稱，保留原有的符號（例如 ~）。日期以「格子所在的星期欄位」為準：weekday 用 1=週一…7=週日；day 是格子左上角的日期數字。另外請把格子裡黑色字的前導／主持／分享人員整理成 crew（例如「主持：美蓁；分享：甲 乙」），只是用來標注，沒有就留空。只回傳 JSON（文字請用繁體中文），格式：{"year":數字,"month":數字,"events":[{"day":數字,"weekday":數字,"title":"活動名稱","speaker":"講師","crew":"主持與分享"}]}';
function mkRows(y,m,list){const dim=new Date(y,m,0).getDate();return list.map(x=>{let day=+x.day,fix=!!x.fix;const wd=+x.weekday;
  if(wd>=1&&wd<=7&&day>=1&&day<=dim){const act=((new Date(y,m-1,day).getDay()+6)%7)+1;if(act!==wd){let best=0,bd=99;for(let d=1;d<=dim;d++){if(((new Date(y,m-1,d).getDay()+6)%7)+1===wd&&Math.abs(d-day)<bd){bd=Math.abs(d-day);best=d}}if(best){day=best;fix=true}}}
  if(day<1||day>dim)day=Math.min(Math.max(day||1,1),dim);
  return{inc:true,date:y+'-'+pad2(m)+'-'+pad2(day),title:String(x.title||'').trim(),speaker:String(x.speaker||'').trim(),crew:String(x.crew||'').trim(),fix}}).filter(r=>r.title)}

const DM={

I:'比較重視內在價值與自己的思考|不一定需要依靠外界認同|歷史上的部分領袖型人物可能具有強烈的內在信念（例：馬丁路德、德蕾莎修女）|I 並不等於不喜歡社交|I 人只是需要找到讓自己安心、放心的社交環境|I 人在安全的環境中也可以非常會社交',
S:'關注實際發生的事情|重視細節|喜歡具體、看得見、可以驗證的資訊|偏向「現在到底發生什麼？」',

J:'喜歡系統化|喜歡有計畫|喜歡事情確定|喜歡掌握進度|傾向先規劃再行動',

const DR={EI:'不要把 E 當成愛講話、I 當成不會社交；應該理解成「注意力與能量主要傾向外界還是內在」。',SN:'現實與遠見都重要；S 不是不會想未來，N 也不是不切實際。',TF:'T 不等於沒感情，F 也不等於不講邏輯；差異在於「做決定時優先考慮什麼」。',JP:'J 不等於認真，P 不等於懶惰；這是「面對外在世界時偏好結構還是彈性」。'};
function mbtiBox(p,k){const t=p.mbti,d=MB[t];if(!d)return anCard('MBTI','',pz(p,k,'mbti','MBTI'),'');
 const g=t[1]==='N'?'N'+t[2]:'S'+t[3],G=GP[g],X=GX[g],L=x=>x?x.split('|').map(i=>`<div>• ${E(i)}</div>`).join(''):'',
 H=(h,b)=>b?`<div style="margin-top:12px"><b>${h}</b></div>${b}`:'',
 sm=x=>`<div class="sub" style="margin-top:4px">${E(x)}</div>`,
 dim=(c,k)=>`<div style="margin-top:6px"><span class="pill y">${c} ${DIM[c]}</span></div>${L(DM[c])}${sm(DR[k])}`,
 none='<div class="sub">這部分你的筆記沒有特別寫</div>';
 const lead=d.c||('關鍵字：'+d.kw.split('|').slice(0,3).join('、'));
 const bd=` ${H('一句話理解',`<div>${E(lead)}</div><div class="sub" style="margin-top:2px">關鍵字：${E(d.kw.split('|').join('、'))}</div>`)}
 ${H('所屬族群',`<div>${G.n}</div><div class="sub">核心：「${E(G.c)}」</div>${L(X.f)}<div class="sub" style="margin-top:4px">同族群四型：${E(X.q)}</div>`)}
 ${H('四個向度',`<div>${[...t].map(x=>x+'｜'+DIM[x]).join('　')}</div>`)}
 ${H('核心特質',L(d.tr.split('|').slice(0,8).join('|')))}
 ${H('他怎麼思考？',`<div class="sub">訊息解讀（${t[1]}）</div>${L(DM[t[1]])}<div class="sub" style="margin-top:6px">關注力（${t[0]}）</div>${L(DM[t[0]])}${sm(DR.SN)}${sm(DR.EI)}`)}
 ${H('他怎麼做決定？',`<div class="sub">決定方式（${t[2]}）</div>${L(DM[t[2]])}${sm(DR.TF)}`)}
 ${H('工作中的樣子',`<div class="sub">計畫習慣（${t[3]}）</div>${L(DM[t[3]])}${sm(DR.JP)}<div class="sub" style="margin-top:6px">${g} 族群傾向</div>${L(X.f)}`)}
 ${H('當主管／領導者',`<div>他最在意：${G.t}</div>${d.bo?`<div class="sub" style="margin-top:4px">如果主管是 ${t}：</div>${L(d.bo)}`:'<div class="sub" style="margin-top:4px">你的筆記沒有針對這型另外寫「如果主管是他」，這裡只有族群原則。</div>'}`)}
 ${H('容易踩雷',d.bl?L(d.bl.split('|').slice(0,5).join('|')):none)}
 ${H('成長課題',d.gr?L(d.gr):none)}
 ${H('跟他相處的方法',L(['溝通時'+G.t.replace('談','談：').replace(/[「」]/g,''),...(d.bo?d.bo.split('|'):[])].slice(0,5).join('|')))}
 ${H('如果要向他報告',`<div>${g} 族群句型範例（把＿換成你的內容）：</div><div style="margin-top:4px">${E(X.e)}</div>`)}
 ${H('一句提醒',d.gr?`<div>${E(d.gr.split('|')[0])}</div>`:none)}
 ${d.ex?H('補充',`<div>${E(d.ex)}</div>`):''}
 <div style="margin-top:14px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line)"><div class="sub">MBTI 不是非黑即白，每個人都可能在光譜上移動。「健全人格」不是把優勢做到最大，而是願意去不同的「房間」生活：練習不擅長的能力、接觸不同類型的人、理解不同思考方式。</div>
 <div style="margin-top:8px">「沒有被察覺到的潛意識，都默默地在教我們；我們卻常常稱之為『命運』。」</div>
 <div class="sub" style="margin-top:6px">MBTI 的目的不是告訴一個人「你就是這樣」，而是讓人看見「原來我習慣這樣思考」，接著可以選擇「我要繼續這樣，還是我要練習另一種方式？」</div>
 <div style="margin-top:6px;color:var(--acc);font-weight:700">理解自己 → 理解別人 → 發現盲點 → 練習不同的能力 → 發展更完整的人格</div></div>

{n:'雙魚座',rg:'2/19–3/20',el:'水',kw:'理解、共感、想像、情感連結',core:'共感型、想像力、情感連結與直覺',psy:'重視情感共鳴、理解與關係中的溫度。|可能對他人的感受、故事與處境有較強的共鳴。|透過想像、創作或情感交流整理自己的經驗。',need:'被理解、被接納、能夠自在表達感受。|不需要每次都立即得到解決方案，有時先被聆聽就很重要。',def:'面對衝突時，可能退縮、逃避或不願直接拒絕。|有時因為不想傷害別人，而沒有清楚表達自己的界線。|容易受氣氛影響的情況，需要透過實際觀察確認，不能直接當成固定性格。',tip:'先聆聽，再詢問對方需要陪伴、建議還是實際協助。|把模糊的期待轉化為具體的選項與步驟。|鼓勵對方說出真正的想法，不必為了讓大家開心而勉強答應。|溫柔不代表沒有原則，理解他人也要保留自己的界線。',work:'可能擅長創作、關懷、故事表達與理解不同觀點。|適合能發揮創意、同理心或人際支持的任務。|需要清楚的工作範圍、期限與回饋，避免因為不好意思拒絕而承擔過多。',love:'常被描述為浪漫、重視共鳴與情感連結。|需要在理解他人與照顧自己之間取得平衡。',key:'他希望被理解的是哪一種感受？他需要陪伴、具體幫助，還是明確的界線？'}];

const zodiacOf=bd=>{const a=String(bd||'').split('-').map(Number);if(a.length<2||!a[0]||!a[1])return '';const v=a[0]*100+a[1],Z=[[120,'水瓶座'],[219,'雙魚座'],[321,'牡羊座'],[420,'金牛座'],[521,'雙子座'],[622,'巨蟹座'],[723,'獅子座'],[823,'處女座'],[923,'天秤座'],[1024,'天蠍座'],[1123,'射手座'],[1222,'摩羯座']];let r='摩羯座';for(const[k,n]of Z)if(v>=k)r=n;return r};
const ownBy=(t,id)=>{const o=t==='l'?S.leaders.find(x=>x.id===+id):getOwn(t+'|'+id);return(o&&o.by)||''};
const bdBox=(t,id,bd,noAge)=>{const k=t+'|'+id,ok=/^\d+-\d+$/.test(bd||''),by=ownBy(t,id),o=t==='l'?S.leaders.find(x=>x.id===+id):getOwn(k);
 if(ok&&S.bdE!==k){const[m,d]=bd.split('-'),a=by&&o?ageOf(o):0,ln=by&&o?lifeNumOf(o):'';return `<span style="display:inline-flex;gap:4px;align-items:center;white-space:nowrap"><span class="sub" style="font-size:12px">${by?by+'/':''}${+m}/${+d}・${zodiacOf(bd)}${a&&!noAge?'・'+a+'歲':''}${ln?'・靈數'+ln:''}</span><button class="x" style="font-size:12px;padding:0;color:var(--acc)" data-bde="${k}">${by?'編輯':'補年份'}</button><button class="x" style="font-size:12px;padding:0;color:var(--sub)" data-bdclr="${k}">重設</button></span>`}
 const v=ok&&by?by+'-'+bd.split('-').map(x=>x.padStart(2,'0')).join('-'):'';
 return `<input type="date" data-bdd="${k}" value="${v}" max="${today()}" style="width:auto;padding:3px 6px;font-size:13px;height:32px">`+(ok?`<span class="sub" style="font-size:13px">${zodiacOf(bd)}</span><button class="x" style="font-size:12px;color:var(--acc)" data-bde="${k}">完成</button><button class="x" style="font-size:12px;color:var(--sub)" data-bdclr="${k}">重設</button>`:'')};
const bdSel=(t,id,bd)=>{const[m,d]=(bd||'-').split('-');const st='width:auto;padding:3px 6px;font-size:13px;height:30px';return `<select data-bd="${t}|${id}|0" style="${st}"><option value="">月</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${+m===i+1?'selected':''}>${i+1}月</option>`).join('')}</select><select data-bd="${t}|${id}|1" style="${st}"><option value="">日</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${+d===i+1?'selected':''}>${i+1}日</option>`).join('')}</select>`};
const bdName=(t,o)=>t==='p'?nm(o):E(o.nick||o.name);
function bdCard(){const l=bdAll().map(([t,o])=>({t,o,n:bdNext(o.bd)})).filter(x=>x.n!==null&&x.n<=7).sort((a,b)=>a.n-b.n);
 const lg=Object.values(BT).map(([n,c])=>`<span class="pill" style="background:${c};color:#fff;border-color:transparent">${n}</span>`).join(' ');
 return `<div class="card"><div class="row"><b class="sp">🎂 一週內生日</b>${lg}</div>${l.map(x=>{const dt=new Date(addD(x.n)+'T00:00:00'),md=(dt.getMonth()+1)+'/'+dt.getDate();return `<div class="row" style="margin-top:6px"><span class="pill" style="flex:none">${x.n===0?'今天 ':x.n===1?'明天 ':''}${md}（週${WD[dt.getDay()]}）</span><b class="sp" data-gp="${x.t}|${x.o.id}" style="cursor:pointer">${bdName(x.t,x.o)}</b><span class="pill" style="background:${BT[x.t][1]};color:#fff;border-color:transparent;flex:none">${BT[x.t][0]}</span></div>`}).join('')||'<div class="sub" style="margin-top:4px">這一週沒有人生日</div>'}</div>`}
function todoCard(){const pend=[],dn=[];[...S.people.map(p=>['p|'+p.id,p,'p']),...S.side.map(x=>['s|'+x.id,x,'s'])].forEach(([own,o,t])=>(o.log||[]).forEach((x,i)=>{if(x.todo)(x.done?dn:pend).push({own,o,x,i,t})}));
 const asc=(a,b)=>(a.x.date+(a.x.time||'')).localeCompare(b.x.date+(b.x.time||''));pend.sort(asc);dn.sort((a,b)=>-asc(a,b));
 const r=it=>`<div class="row" style="margin:7px 0;align-items:flex-start"><input type="checkbox" style="width:20px;height:20px;flex:none;margin-top:2px" ${it.x.done?'checked':''} data-lk="${it.own}|${it.i}"><div class="sp"><span class="${it.x.done?'done':''}">${E(it.x.todo)}</span><div class="sub"><b data-gp="${it.t}|${it.o.id}" style="color:var(--acc);cursor:pointer">${bdName(it.t,it.o)}</b>${it.t==='s'?'（旁線）':''}・對答案 ${it.x.date.slice(5).replace('-','/')}</div></div></div>`;
 return `<div class="card"><div class="row"><b class="sp">對答案後要做的事</b><span class="sub">待辦 ${pend.length}</span></div>${pend.map(r).join('')||'<div class="sub" style="margin-top:4px">目前沒有待辦</div>'}${dn.length?`<button class="x" style="font-size:12px;color:var(--acc)" data-tdone="1">${S.tdone?'收合已完成':'已完成 '+dn.length+' 筆'}</button>${S.tdone?dn.map(r).join(''):''}`:''}</div>`}

document.addEventListener('pointerup',e=>{if(!RDR)return;const k=RDR.k,z=RDR.z,dn=RDR.dn;RDR=null;document.querySelectorAll('[data-rz]').forEach(n=>n.style.boxShadow='');if(!z||z===k)return;const[t,lid,id]=k.split('|'),to=+z.split('|')[2];
 if(t==='s'){const i=S.side.findIndex(x=>x.id===+id);if(i<0)return;const[x]=S.side.splice(i,1),j=S.side.findIndex(y=>y.id===to);S.side.splice(j<0?S.side.length:j+(dn?1:0),0,x)}
 else{const l=S.leaders.find(x=>x.id===+lid);if(!l)return;const ids=flOf(l).map(p=>p.id),i=ids.indexOf(+id);ids.splice(i,1);ids.splice(ids.indexOf(to)+(dn?1:0),0,+id);l.ford=ids}
 save();render()});
document.addEventListener('pointercancel',()=>{RDR=null});
let ODR=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('[data-dh]');if(!h)return;ODR={id:+h.dataset.dh,z:null};e.preventDefault&&e.preventDefault()});
const odzAt=(x,y)=>{const el=document.elementFromPoint&&document.elementFromPoint(x,y),z=el&&el.closest&&el.closest('[data-dz]');return z?z.dataset.dz:null};
document.addEventListener('pointermove',e=>{if(!ODR)return;const z=odzAt(e.clientX,e.clientY);if(z!==ODR.z){document.querySelectorAll('[data-dz]').forEach(n=>n.style.outline='');ODR.z=z;const n=z&&document.querySelector('[data-dz="'+z+'"]');if(n&&z!==String(ODR.id))n.style.outline='2px solid var(--acc)'}});
const odend=e=>{if(!ODR)return;const z=ODR.z||odzAt(e.clientX,e.clientY),id=ODR.id;ODR=null;document.querySelectorAll('[data-dz]').forEach(n=>n.style.outline='');if(z!==null&&dropObj(id,z)){save();render()}else if(z!==null)toast('不能放到自己或自己的下層')};
document.addEventListener('pointerup',odend);document.addEventListener('pointercancel',()=>{ODR=null});
const CTR=['evq','rp','epx','evx','pold','pmo','prdv','prnv','shf','evc','evf','enf','eip','prc','prt','rsc','fx','lfx','mrk','nxo','nxv','fua','qm','qs','qoff','rco','rcall','mrp','osort','cto','ctall','area','trip','pm','pnew','pkgw','tab','view','q','flt','cf','lv','fb','fs','fl','fc','pn','aq','pkg','pd','cm','av'];
CL.msg=()=>CL.st;
function cloudQ(){if(!CL.col||!CL.ok)return;clearTimeout(CL.tm);CL.st='☁︎ 等待同步…';CL.tm=setTimeout(cloudPush,1500)}
async function cloudPush(){
 if(CL.busy){CL.again=1;return}
 CL.busy=1;
 try{
  if(!localStorage.getItem('roster-t'))localStorage.setItem('roster-t',String(Date.now()));
  const t=+localStorage.getItem('roster-t');
  for(const k of Object.keys(S)){if(CTR.includes(k))continue;const j=JSON.stringify(S[k]);if(j===undefined||j===CL.last[k])continue;if(j.length>240000){CL.st='⚠︎「'+k+'」資料太大，無法同步';continue}await CL.col.doc('s_'+k).set({j});CL.last[k]=j}
  await CL.col.doc('s__meta').set({t});
  CL.st='☁︎ 已同步到雲端 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
 }catch(e){CL.st=navigator.onLine?'⚠︎ 雲端同步失敗，資料仍存在這支手機（'+((e&&e.code)||'錯誤')+'）':'📴 離線中：資料先存在這支手機，連上網路會自動同步'}
 CL.busy=0;if(CL.again){CL.again=0;cloudQ()}
}
(async()=>{
 try{
  const db=await claude.use('db'),us=await claude.use('user');
  const uid=us&&await us.id();
  if(!db||!uid){CL.st='⚠︎ 沒有連到雲端（請重新登入），資料只存在這支手機';return}
  CL.col=db.collection('data/users/'+uid);
  const snap=await CL.col.get(),docs={};
  snap.docs.forEach(d=>{docs[d.id]=d.data()});
  const ct=docs.s__meta?(+docs.s__meta.t||0):0,lt=CL.LT0,hasLocal=CL.HAS0;
  if(ct>lt){
   let rl='';try{rl=sessionStorage.getItem('rl')}catch(e){}
   if(rl!==String(ct)){
    let o={};try{o=JSON.parse(localStorage.getItem('roster-v2')||'{}');localStorage.setItem('roster-prev',localStorage.getItem('roster-v2')||'')}catch(e){}
    Object.keys(docs).forEach(id=>{if(id.startsWith('s_')&&id!=='s__meta'){try{o[id.slice(2)]=JSON.parse(docs[id].j)}catch(e){}}});
    localStorage.setItem('roster-v2',JSON.stringify(o));localStorage.setItem('roster-t',String(ct));
    try{sessionStorage.setItem('rl',String(ct))}catch(e){}
    location.reload();return}
  }
  Object.keys(docs).forEach(id=>{if(id.startsWith('s_')&&id!=='s__meta')CL.last[id.slice(2)]=docs[id].j});
  CL.ok=1;
  if((ct===0&&hasLocal)||lt>ct){cloudPush()}else CL.st='☁︎ 已同步到雲端';
 }catch(e){CL.st=navigator.onLine?'⚠︎ 雲端連線失敗，資料只存在這支手機':'📴 離線中：資料先存在這支手機，連上網路會自動同步'}
})();
// 恢復網路：一開始沒連上雲端就重新載入比對新舊；之前連上過就把沒送出的變更補送
window.addEventListener('online',()=>{if(CL.ok){if(String(CL.st).startsWith('⚠︎')||String(CL.st).startsWith('📴'))cloudQ();return}const go=()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return setTimeout(go,2000);location.reload()};toast('已恢復網路，正在同步…');setTimeout(go,1500)});
window.addEventListener('offline',()=>{if(CL.ok){CL.st='📴 離線中：資料先存在這支手機，連上網路會自動同步';try{render()}catch(e){}}});
render();
setTimeout(phSync,4000);
