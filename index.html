const dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('roster-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const idb=(m,fn)=>dbp.then(db=>new Promise((res,rej)=>{const t=db.transaction('p',m),q=fn(t.objectStore('p'));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)}));
const putPh=(id,b)=>idb('readwrite',s=>s.put(b,id)),getPh=id=>idb('readonly',s=>s.get(id)),delPh=id=>{if(window.FBP){FBP.del(id);phMark(id,false)}return idb('readwrite',s=>s.delete(id)).catch(()=>{})};
// 照片雲端備份：記錄哪些照片已經上傳（存在這支手機）
const phSet=()=>{try{return new Set(JSON.parse(localStorage.getItem('ph-cloud')||'[]'))}catch(e){return new Set()}};
const phMark=(id,on)=>{try{const s=phSet();on?s.add(id):s.delete(id);localStorage.setItem('ph-cloud',JSON.stringify([...s]))}catch(e){}};
const phAll=()=>[...S.people,...S.events,...S.leaders,...S.side,...(S.stories||[])].flatMap(o=>o.photos||[]);
const phUp=(id,b)=>window.FBP?FBP.put(id,b).then(()=>phMark(id,true)):Promise.reject();
async function phSync(){if(!window.FBP||phSync.on)return;phSync.on=1;const done=phSet();for(const id of phAll()){if(done.has(id))continue;try{const b=await getPh(id);if(b)await phUp(id,b)}catch(e){}}phSync.on=0;if(S.tab==='bk'&&!S.view)render()}
// 會議檔案／錄音：手機裡存一份（IndexedDB），雲端切成小塊存（每塊約 600KB），換手機登入後會自動下載
const FMAX=8*1024*1024,FCH=600*1024;
const fAll=()=>(S.confs||[]).flatMap(c=>c.files||[]);
async function fUp(f,b){if(!window.FBP)throw new Error('no cloud');for(let i=0;i<f.n;i++)await FBP.put(f.id+'_'+i,b.slice(i*FCH,(i+1)*FCH));phMark('f:'+f.id,true)}
async function fGet(f){let b=await getPh('f_'+f.id);if(!b&&window.FBP){try{const a=[];for(let i=0;i<f.n;i++){const x=await FBP.get(f.id+'_'+i);if(!x)return null;a.push(x)}b=new Blob(a,{type:f.type||''});await putPh('f_'+f.id,b);phMark('f:'+f.id,true)}catch(e){return null}}return b}
async function fSync(){if(!window.FBP||fSync.on)return;fSync.on=1;const done=phSet();for(const f of fAll()){if(done.has('f:'+f.id))continue;try{const b=await getPh('f_'+f.id);if(b)await fUp(f,b)}catch(e){}}fSync.on=0}
async function fAdd(c,blob,name){if(blob.size>FMAX){toast('檔案超過 8MB，請改放 Google 雲端硬碟或 YouTube，再貼連結');return}const id='fl'+Date.now()+Math.random().toString(36).slice(2,6),f={id,name:name||'檔案',type:blob.type||'',size:blob.size,n:Math.max(1,Math.ceil(blob.size/FCH)),at:today()};
 try{await putPh('f_'+id,blob)}catch(e){toast('這支手機無法儲存檔案');return}c.files=c.files||[];c.files.push(f);save();render();
 if(window.FBP){toast('上傳到雲端中…');fUp(f,blob).then(()=>{toast('已存到雲端，換手機也看得到');render()}).catch(()=>toast('雲端上傳失敗，下次打開會再試'))}else toast('已存在這支手機（沒有登入雲端，換手機會看不到）')}
const fSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const FURL={};const fUrl=f=>FURL[f.id]?Promise.resolve(FURL[f.id]):fGet(f).then(b=>b?(FURL[f.id]=URL.createObjectURL(b)):'');
const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:''};
const REC={};
const URLS={};
const urlFor=id=>URLS[id]?Promise.resolve(URLS[id]):getPh(id).then(async b=>{if(!b&&window.FBP){try{b=await FBP.get(id);if(b){await putPh(id,b);phMark(id,true)}}catch(e){}}return b?(URLS[id]=URL.createObjectURL(b)):''});
function hydrate(){document.querySelectorAll('img[data-ph]').forEach(im=>urlFor(im.dataset.ph).then(u=>{if(u)im.src=u}).catch(()=>{}));document.querySelectorAll('[data-fid]').forEach(el=>{const f=fAll().find(x=>x.id===el.dataset.fid);if(f&&!el.src)fUrl(f).then(u=>{if(u)el.src=u;else if(el.dataset.miss)el.outerHTML='<span class="sub" style="font-size:12px">（雲端還沒有這個檔案）</span>'}).catch(()=>{})})}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('x')),'image/jpeg',.72)};im.onerror=()=>rej(new Error('x'));im.src=u})}

function mkRows(y,m,list){const dim=new Date(y,m,0).getDate();return list.map(x=>{let day=+x.day,fix=!!x.fix;const wd=+x.weekday;
  if(wd>=1&&wd<=7&&day>=1&&day<=dim){const act=((new Date(y,m-1,day).getDay()+6)%7)+1;if(act!==wd){let best=0,bd=99;for(let d=1;d<=dim;d++){if(((new Date(y,m-1,d).getDay()+6)%7)+1===wd&&Math.abs(d-day)<bd){bd=Math.abs(d-day);best=d}}if(best){day=best;fix=true}}}

  return{inc:true,date:y+'-'+pad2(m)+'-'+pad2(day),title:String(x.title||'').trim(),speaker:String(x.speaker||'').trim(),crew:String(x.crew||'').trim(),fix}}).filter(r=>r.title)}

    let o={};try{o=JSON.parse(localStorage.getItem('roster-v2')||'{}');localStorage.setItem('roster-prev',localStorage.getItem('roster-v2')||'')}catch(e){}
    Object.keys(docs).forEach(id=>{if(id.startsWith('s_')&&id!=='s__meta'){try{o[id.slice(2)]=JSON.parse(docs[id].j)}catch(e){}}});
    localStorage.setItem('roster-v2',JSON.stringify(o));localStorage.setItem('roster-t',String(ct));
    try{sessionStorage.setItem('rl',String(ct))}catch(e){}
    location.reload();return}
  }
  Object.keys(docs).forEach(id=>{if(id.startsWith('s_')&&id!=='s__meta')CL.last[id.slice(2)]=docs[id].j});
  CL.ok=1;
  if((ct===0&&hasLocal)||lt>ct){cloudPush()}else CL.st='☁︎ 已同步到雲端';
 }catch(e){CL.st=navigator.onLine?'⚠︎ 雲端連線失敗，資料只存在這支手機':'📴 離線中：資料先存在這支手機，連上網路會自動同步'}
})();
// 恢復網路：一開始沒連上雲端就重新載入比對新舊；之前連上過就把沒送出的變更補送
window.addEventListener('online',()=>{if(CL.ok){if(String(CL.st).startsWith('⚠︎')||String(CL.st).startsWith('📴'))cloudQ();return}const go=()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return setTimeout(go,2000);location.reload()};toast('已恢復網路，正在同步…');setTimeout(go,1500)});
window.addEventListener('offline',()=>{if(CL.ok){CL.st='📴 離線中：資料先存在這支手機，連上網路會自動同步';try{render()}catch(e){}}});
render();
setTimeout(phSync,4000);setTimeout(fSync,6000);
</script>
