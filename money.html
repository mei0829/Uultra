let DARK=false;
function applyTheme(skin,mode){
 const k=SKINS[skin]?skin:'blue',s=SKINS[k],mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');

 const r=document.documentElement;Object.keys(v).forEach(n=>r.style.setProperty('--'+n,v[n]));r.dataset.theme=DARK?'dark':'light';
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=v.bg;
 try{localStorage.setItem('money-theme',JSON.stringify([skin||'',mode||'auto']))}catch(e){}
}

}

// ── 圖表小工具 ──
const niceMax=v=>{if(!(v>0))return 1;const p=10**Math.floor(Math.log10(v));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p};
const cpt=v=>{if(HIDE)return'•';const a=Math.abs(v);return(v<0?'-':'')+(a>=1e8?+(a/1e8).toFixed(1)+'億':a>=1e4?+(a/1e4).toFixed(a>=1e5?0:1)+'萬':a>=1000?+(a/1000).toFixed(1)+'千':Math.round(a))};
const SER=()=>DARK?['#3987e5','#d95926']:['#2a78d6','#eb6834'];
const colPath=(x,y,w,h,base)=>{const r=Math.min(4,h,w/2);return`M${x},${base}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${base}Z`};
// 直條圖（單一系列）：d=[{k,label,v,tip,on}]
function colChart(d){
 const W=340,H=170,pl=34,pt=12,pb=22,base=H-pb,mx=niceMax(Math.max(...d.map(x=>x.v))),bw=(W-pl)/d.length,cw=Math.min(24,bw*.62);
 let g=[0,.5,1].map(f=>{const y=base-(base-pt)*f;return`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${cpt(mx*f)}</text>`}).join('');
 d.forEach((x,i)=>{const h=(base-pt)*x.v/mx,X=pl+bw*i+(bw-cw)/2;
  if(h>0.5)g+=`<path d="${colPath(X,base-h,cw,h,base)}" fill="var(--acc)" opacity="${x.on?1:.4}"/>`;
  g+=`<text x="${X+cw/2}" y="${H-6}" text-anchor="middle" style="${x.on?'fill:var(--ink);font-weight:700':''}">${E(x.label)}</text><rect x="${pl+bw*i}" y="0" width="${bw}" height="${H}" fill="transparent" data-tip="${E(x.tip)}" data-a="chm" data-i="${x.k}" style="cursor:pointer"/>`});
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="每月支出直條圖">${g}</svg>`;
}
// 折線圖（兩個系列）：pts=[{x,a,b,tip}]，a 是主線
function lineChart(pts,names){

 const sx=x=>pl+(W-pl-pr)*(x-X0)/((X1-X0)||1),sy=v=>base-(base-pt)*v/mx;
 let g=[0,.5,1].map(f=>{const y=sy(mx*f);return`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${cpt(mx*f)}</text>`}).join('');
 const line=k=>pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+','+sy(p[k]).toFixed(1)).join('');
 g+=`<path d="${line('a')}L${sx(X1)},${base}L${sx(X0)},${base}Z" fill="${c[0]}" opacity=".1"/>`;
 g+=`<path d="${line('b')}" fill="none" stroke="${c[1]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="${line('a')}" fill="none" stroke="${c[0]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
 const L=pts[pts.length-1];g+=`<circle cx="${sx(L.x)}" cy="${sy(L.b)}" r="4" fill="${c[1]}" stroke="var(--card)" stroke-width="2"/><circle cx="${sx(L.x)}" cy="${sy(L.a)}" r="4" fill="${c[0]}" stroke="var(--card)" stroke-width="2"/>`;
 [X0,Math.round((X0+X1)/2),X1].forEach(x=>{g+=`<text x="${sx(x)}" y="${H-6}" text-anchor="middle">第 ${x} 年</text>`});
 const step=(W-pl-pr)/((X1-X0)||1);pts.forEach(p=>{g+=`<rect x="${sx(p.x)-step/2}" y="0" width="${step}" height="${H}" fill="transparent" data-tip="${E(p.tip)}"/>`});
 return`<div class="lg"><span><i style="background:${c[0]}"></i>${names[0]}</span><span><i style="background:${c[1]}"></i>${names[1]}</span></div><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${names.join('與')}折線圖">${g}</svg>`;
}

function gsearch(q){
 q=String(q||'').trim().toLowerCase();if(!q)return'';const has=v=>String(v==null?'':v).toLowerCase().includes(q),plain=h=>h.replace(/<[^>]+>/g,'');
 const bankOf=a=>{const b=a.code&&BANKS.find(x=>x[0]===a.code);return b?b[1]:''};
 const ac=S.accts.filter(a=>has(a.name)||has(a.group)||has(a.official)||has(a.no)||has(a.code)||has(bankOf(a))||has(TY[a.type]));
 const ids=new Set(ac.map(a=>a.id)),t0=today();
 const tx=S.tx.filter(t=>has(t.note)||has(t.cat)||has(t.shop)||ids.has(t.acct)||ids.has(t.to)).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0));
 const bl=S.bills.filter(b=>has(b.name)||has(b.note)||has(b.cat)||has(b.sym)||ids.has(b.acct));
 const py=S.payees.filter(p=>has(p.name)||has(p.bank)||has(p.no)||has(p.code)||has(p.note));
 const hs=holdings().filter(h=>has(h.sym)||has(h.name));
 const pl=S.plan.items.filter(x=>has(x.name));
 const hp=HELP.filter(h=>has(h[1])||has(plain(h[3])));
 const sec=(t,n,body)=>n?`<h2 style="margin-top:14px">${t}（${n}）</h2><div class="card" style="padding:6px 12px">${body}</div>`:'';
 const acLine=a=>{const I=isCard(a)&&cardInfo(a),cl=isCard(a)&&closeOf(a,t0);return`<div class="ar" data-a="${isCard(a)?'card':'edacct'}" data-i="${a.id}"><div class="sp"><div><b>${E(nm(a))}</b> <span class="pill">${TY[a.type]}</span></div><div class="sub">${isCard(a)?`本期 ${md(cl)} 結帳、${md(dueOf(a,cl))} 繳款${a.official?' · '+E(a.official):''}${I.billed.length?' · 已出帳待繳 '+M(I.billed.reduce((s,x)=>s+x.left,0)):''}`:[bankOf(a)&&bankOf(a)+'（'+a.code+'）',a.no&&copyTag(a.no,tail5(a.no))].filter(Boolean).join(' · ')}</div></div><b class="num">${isCard(a)?'<span class="sub">未繳</span> '+M(I.owe):(a.excl?'<span class="sub">🔒 不計入</span> ':'')+MA(a)}</b></div>`};
 const out=tx.filter(t=>t.type==='out').reduce((s,t)=>s+myA(t),0),inc=tx.filter(isInc).reduce((s,t)=>s+t.amt,0);
 let h='';
 h+=sec('帳戶',ac.length,ac.map(acLine).join('')+(ac.filter(a=>!isCard(a)).length>1?`<div class="row" style="padding:6px 2px;border-top:1px solid var(--line)"><span class="sp sub">存款合計${exAccts().length?'（不含 🔒）':''}</span><b class="num">${M(ac.filter(a=>!isCard(a)&&!a.excl).reduce((s,a)=>s+conv(bal(a),a.cur,'TWD'),0))}</b></div>`:''));
 h+=sec('記帳紀錄',tx.length,`<div class="sub" style="padding:4px 2px">支出合計 ${M(out)}${inc?'、收入合計 '+M(inc):''}</div>`+tx.slice(0,20).map(txLine).join('')+(tx.length>20?`<div class="sub" style="padding:6px 2px">還有 ${tx.length-20} 筆，到「記帳」頁用搜尋或帳戶篩選看全部</div>`:''));
 h+=sec('固定收支',bl.length,bl.map(b=>`<div class="ar" data-a="edbill" data-i="${b.id}"><div class="sp"><div>${E(b.name)}</div><div class="sub">${fqName(b.freq)} · 下次 ${md(b.next)} · ${E(nm(A(b.acct)))}</div></div><b class="num">${MC(b.amt,bcur(b))}</b></div>`).join(''));
 h+=sec('常用匯款帳號',py.length,py.map(p=>`<div class="ar" data-a="edpayee" data-i="${p.id}"><div class="sp"><div>${E(p.name)}</div><div class="sub">${p.no?(p.code?'('+E(p.code)+') ':'')+copyTag(p.no,tail5(p.no)):''}${p.bank?' · '+E(p.bank):''}</div></div></div>`).join(''));
 h+=sec('股票',hs.length,hs.map(x=>`<div class="ar" data-a="tab" data-i="stock"><div class="sp"><div><b>${E(x.sym)}</b> ${E(x.name)}</div><div class="sub">${+x.sh.toFixed(4)} 股</div></div><b class="num">${MC(x.val,x.cur)}</b></div>`).join(''));
 h+=sec('分帳戶',pl.length,pl.map(x=>`<div class="ar" data-a="tab" data-i="plan"><div class="sp">${E(x.name)}</div><b class="num">${M(pa(x))}</b></div>`).join(''));
 h+=sec('使用說明',hp.length,hp.map(x=>`<div class="ar" data-a="hpq" data-i="${x[0]}"><div class="sp">${E(x[1])}</div><span class="sub">›</span></div>`).join(''));
 return h||'<div class="sub" style="padding:16px 2px">找不到「'+E(q)+'」。可以換個字試試，例如銀行名、店名、分類、股票代號。</div>';
}

 <div class="card"><div class="sub" style="margin-bottom:6px">這個月支出 <b class="num" style="color:var(--ink)">${M(tot)}</b>　・點有小圓點的日子＝那天要繳錢</div><div class="cal">${[...WD].map(w=>`<span>${w}</span>`).join('')}${'<i></i>'.repeat(d0.getDay())}`;

// 依照最近的記帳算預算建議：記滿 30 天才給，最多看最近 90 天；想要的（購物、娛樂…）建議少 10%
const FLEX=['購物','娛樂','服飾穿搭','咖啡飲品','點心','按摩','其他'];
function budgetSug(){const t0=today(),xs=S.tx.filter(t=>t.type==='out'&&!t.bill&&myA(t)>0&&t.d<=t0);if(!xs.length)return{days:0};
 const first=xs.reduce((m,t)=>t.d<m?t.d:m,t0),days=1-dleft(first);if(days<30)return{days};
 const n=Math.min(days,90),from=shiftD(t0,-(n-1)),by={};xs.filter(t=>t.d>=from).forEach(t=>{by[t.cat||'其他']=(by[t.cat||'其他']||0)+myA(t)});
 const rows=Object.keys(by).map(c=>{const avg=by[c]/n*30.4,f=FLEX.includes(c);return{c,avg,f,sug:Math.max(100,Math.ceil(avg*(f?0.9:1)/100)*100)}}).filter(r=>r.avg>=50).sort((a,b)=>b.avg-a.avg);
 return{days,n,rows,tot:rows.reduce((a,r)=>a+r.sug,0),avg:rows.reduce((a,r)=>a+r.avg,0)}}
function budgetSugCard(){const G=budgetSug(),B=S.budget;
 if(G.days<30){const d=G.days||0;return`<div class="card"><b>先記帳，之後幫你算預算</b><div class="sub" style="margin-top:4px">${d?'已經記帳 <b>'+d+'</b> 天，':'還沒有支出紀錄，'}記滿 30 天，這裡會依照你的消費習慣建議每個分類的預算（記 60 天會更準）。這段時間照常記就好，不用先設。</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,d/30*100)}%"></i></div><div class="sub" style="text-align:right">${d} / 30 天</div></div>`}
 const inc=wInc(),top=G.rows[0],fl=G.rows.filter(r=>r.f),save=fl.reduce((a,r)=>a+(r.avg-r.sug),0);
 return`<h2>依照你的消費習慣</h2><div class="card"><div class="sub">最近 ${G.n} 天，平均每個月日常花 <b class="num">${M(G.avg)}</b>${inc?'，是收入的 '+Math.round(G.avg/inc*100)+'%':''}</div>
 <table class="pv" style="margin-top:8px"><tr><th>分類</th><th style="text-align:right">平均每月</th><th style="text-align:right">建議預算</th><th></th></tr>${G.rows.map(r=>`<tr><td>${E(r.c)}</td><td class="num" style="text-align:right">${M(r.avg)}</td><td class="num" style="text-align:right"><b>${M(r.sug)}</b>${r.f?'<div class="sub">少 10%</div>':''}</td><td style="text-align:right">${+B.cats[r.c]===r.sug?'<span class="sub">✓</span>':`<button class="go q" style="padding:3px 8px;font-size:12px" data-a="bsug1" data-i="${E(r.c)}">套用</button>`}</td></tr>`).join('')}</table>
 <div class="msg" style="margin-top:8px">${top?`花最多的是「<b>${E(top.c)}</b>」，每月約 ${M(top.avg)}。`:''}${save>50?`「想要的」東西（${fl.slice(0,3).map(r=>E(r.c)).join('、')}）各少 10%，每月可以多存約 <b>${M(save)}</b>。`:''}</div>
 <div class="row" style="gap:8px;margin-top:10px"><button class="go sp" data-a="bsugall">全部套用（總預算 ${M(G.tot)}）</button><button class="go g sp" data-a="bsugai">請 AI 幫我看看</button></div>
 ${U.bai?`<div class="note keep" style="margin-top:10px;font-size:14px;color:var(--ink)">${U.bai}</div>`:''}
 <div class="note" data-t="建議怎麼算的？">用最近最多 90 天的支出（不含固定收支自動記的、幫朋友代墊的部分），換算成平均每個月。吃飯、交通這種需要的照平均給；購物、娛樂、飲料這種想要的建議少 10%。之後每個月可以再回來看，習慣變了建議也會跟著變。</div></div>`}
function vBudget(){

 if(noB.length)h+=`<h2>沒設預算的分類</h2><div class="card">${hbars(noB.map(c=>[c,sp[c]]).sort((a,b)=>b[1]-a[1]))}</div>`;
 h+=budgetSugCard();

 <div class="grid" style="margin-top:8px">${S.cats.out.map(c=>`<label class="fl"><span>${E(c)}</span><input inputmode="numeric" data-m="budget.cats.${E(c)}" data-s="1" data-n="1" value="${E(B.cats[c]||'')}" placeholder="—"></label>`).join('')}</div>

 return h;
}

  const h=by[t.sym]=by[t.sym]||{sym:t.sym,name:'',sh:0,cost:0,real:0,div:0,cur:t.cur||'TWD'};if(t.name)h.name=t.name;
  if(t.type==='buy'){h.sh+=t.sh;h.cost+=t.sh*t.px+(+t.fee||0)}
  else if(t.type==='sell'){const sh=Math.min(t.sh,h.sh),co=h.sh?h.cost/h.sh*sh:0,r=t.sh*t.px-(+t.fee||0)-(+t.tax||0)-co;h.real+=r;h.cost-=co;h.sh-=sh;SEV.push({d:t.d,sym:t.sym,real:r,div:0,cur:h.cur})}
  else{h.div+=+t.amt||0;SEV.push({d:t.d,sym:t.sym,real:0,div:+t.amt||0,cur:h.cur})}});
 return Object.values(by).map(h=>{const p=S.prices[h.sym];h.px=p?+p.p:null;h.pd=p?p.d:'';h.val=h.px!=null?h.sh*h.px:h.cost;h.unreal=h.px!=null?h.val-h.cost:0;return h});
}

function pDate(s){
 s=String(s||'').trim();let m,y,mo,d;
 if(m=s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/))[y,mo,d]=[+m[1],+m[2],+m[3]];
 else if(m=s.match(/^(\d{2,3})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/))[y,mo,d]=[+m[1]+1911,+m[2],+m[3]];
 else if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/))[y,mo,d]=[+m[1],+m[2],+m[3]];
 else if(m=s.match(/^(\d{3})(\d{2})(\d{2})$/))[y,mo,d]=[+m[1]+1911,+m[2],+m[3]];
 else if(m=s.match(/^(\d{1,2})[\/\-月](\d{1,2})日?$/)){y=new Date().getFullYear();mo=+m[1];d=+m[2];if(mo>=1&&mo<=12&&dleft(iso(new Date(y,mo-1,d)))>31)y--}
 else return '';
 if(mo<1||mo>12||d<1||d>dim(y,mo-1)||y<1990||y>2100)return '';

}
function pAmt(s){

 if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
 s=s.replace(/NT\$?|TWD|\$|＄|元|,|，|\s/gi,'');
 if(/-$/.test(s)){neg=!neg;s=s.slice(0,-1)}

}
function csv(text){
 const head=text.split(/\r?\n/).slice(0,30).join('\n');
 const sep=[',','\t',';','|'].map(s=>[s,head.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
  else cur+=ch}
 if(cur||row.length){row.push(cur);rows.push(row)}
 return rows.map(r=>r.map(c=>c.replace(/^﻿/,'').trim().replace(/^="?|"$/g,'').trim())).filter(r=>r.some(c=>c));
}

const PXSRC=[['https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL','Code','ClosingPrice'],['https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes','SecuritiesCompanyCode','Close']];
async function fetchFX(force){
 if(!force){try{if(localStorage.getItem('money-fxday')===today())return}catch(e){}}
 const src=[['https://open.er-api.com/v6/latest/USD',j=>j.rates&&j.rates.TWD],['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',j=>j.usd&&j.usd.twd]];
 for(const[u,f]of src){try{const r=await fetch(u);if(!r.ok)continue;const v=+f(await r.json());if(v>10&&v<100){S.fx={USD:Math.round(v*1000)/1000,d:today(),auto:1};try{localStorage.setItem('money-fxday',today())}catch(e){}save();return true}}catch(e){}}

async function usPrice(sym){
 for(const h of['query1','query2']){try{const r=await fetch(`https://${h}.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=1d&interval=1d`);if(!r.ok)continue;const m=(await r.json()).chart.result[0].meta,p=+m.regularMarketPrice;if(p>0)return{p,d:iso(new Date(m.regularMarketTime*1000))}}catch(e){}}
 try{const r=await fetch(`https://stooq.com/q/l/?s=${encodeURIComponent(sym.toLowerCase())}.us&f=sd2c&h&e=csv`);if(r.ok){const l=(await r.text()).trim().split(/\r?\n/)[1].split(','),p=+l[2];if(p>0)return{p,d:pDate(l[1])||today()}}}catch(e){}
 return null;
}
async function fetchPrices(force){
 const all=holdings().filter(h=>h.sh>0),syms=all.filter(h=>h.cur!=='USD').map(h=>h.sym),us=all.filter(h=>h.cur==='USD').map(h=>h.sym);if(!all.length)return 0;
 if(!force){try{if(localStorage.getItem('money-pxday')===today())return 0}catch(e){}}
 const got={};let ok=0,n=0;
 for(const sy of us){const r=await usPrice(sy);if(r){ok++;got[sy]=1;const old=S.prices[sy];if(!old||!old.d||old.d<=r.d){S.prices[sy]={p:r.p,d:r.d,auto:1};n++}}}
 for(const[u,kc,kp]of PXSRC){if(!syms.length)break;
  if(syms.every(x=>got[x]))break;
  try{const r=await fetch(u);if(!r.ok)continue;const js=await r.json();if(!Array.isArray(js))continue;ok++;
   js.forEach(x=>{const c=String(x[kc]||'').trim().toUpperCase();if(!syms.includes(c)||got[c])return;const p=pAmt(x[kp]);if(!(p>0))return;got[c]=1;
    const d=pDate(x.Date)||today(),old=S.prices[c];if(!old||!old.d||old.d<=d){S.prices[c]={p,d,auto:1};n++}})}catch(e){}
 }
 if(ok)try{localStorage.setItem('money-pxday',today())}catch(e){}
 if(n)save();
 // -1：連不到；-2：找到了但手上的股價比較新
 return !ok?-1:n?n:Object.keys(got).length?-2:0;
}

 tt:i=>{const o=U.sheet.o;o.type=i;if(!o.feeSet)Object.assign(o,calcFee(o));render()},
 savetrade:()=>{const o=U.sheet.o,sym=String(o.sym||'').trim().toUpperCase();if(!sym)return toast('請輸入股票代號');
  const t={id:o.id||nid(),d:o.d||today(),type:o.type,sym,name:String(o.name||'').trim(),acct:o.acct||'',ts:o.ts||Date.now()};if(o.cur==='USD')t.cur='USD';
  const prev=holdings().find(x=>x.sym===sym&&x.cur!==(o.cur||'TWD'));if(prev&&!S.trades.some(x=>x.id===o.id&&x.sym===sym))return toast(sym+' 之前記成'+(prev.cur==='USD'?'美股':'台股')+'，請選一樣的市場');
  if(o.type==='div'){t.amt=pAmt(o.amt);if(!(t.amt>0))return toast('請輸入股利金額')}
  else{t.sh=pAmt(o.sh);t.px=pAmt(o.px);if(!(t.sh>0)||!(t.px>0))return toast('請輸入股數和成交價');t.fee=pAmt(o.fee)||0;if(o.type==='sell'){t.tax=pAmt(o.tax)||0;const h=holdings().find(x=>x.sym===sym),own=(h?h.sh:0)+(o.id&&o.type==='sell'?(S.trades.find(x=>x.id===o.id)||{}).sh||0:0);if(t.sh>own+1e-9&&!confirm('賣出的股數比手上的多（手上 '+own+' 股），還是要儲存？'))return}}
  if(!t.name){const h=holdings().find(x=>x.sym===sym);if(h)t.name=h.name}
  const k=S.trades.findIndex(x=>x.id===t.id);if(k>=0)S.trades[k]=t;else S.trades.push(t);U.sheet=null;save();render();toast('已記錄')},
 deltrade:()=>{if(!confirm('刪除這筆交易？'))return;S.trades=S.trades.filter(x=>x.id!==U.sheet.o.id);U.sheet=null;save();render()},
});
// 圖表提示框：滑過或點一下圖上的直條／年份
const tipEl=$('tip'),posTip=e=>{const w=tipEl.offsetWidth,h=tipEl.offsetHeight;tipEl.style.left=Math.max(8,Math.min(innerWidth-w-8,e.clientX-w/2))+'px';tipEl.style.top=(e.clientY-h-14<8?e.clientY+18:e.clientY-h-14)+'px'};
document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tipEl.style.display='none';return}tipEl.innerHTML=el.getAttribute('data-tip');tipEl.style.display='block';posTip(e)});
document.addEventListener('pointermove',e=>{if(tipEl.style.display==='block')posTip(e)});
window.addEventListener('scroll',()=>{tipEl.style.display='none'},{passive:true});
// 在空白的地方快速點兩下：隱藏／顯示金額（按鈕、輸入框、可以點的列不算）
let TAP0=0,TAPX=0,TAPY=0;
document.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button)return;const t=e.target;if(t.closest('input,select,textarea,button,a,label,[data-a],.sheet,nav,svg'))return TAP0=0;
 const n=Date.now();if(n-TAP0<350&&Math.abs(e.clientX-TAPX)<30&&Math.abs(e.clientY-TAPY)<30){TAP0=0;ACT.eye()}else{TAP0=n;TAPX=e.clientX;TAPY=e.clientY}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='askq'&&!e.isComposing){e.preventDefault();ACT.asksend();return}if(e.key==='Enter'&&e.target.id==='pkq'&&!e.isComposing){e.preventDefault();S.perk.q=e.target.value;save();perkGo(false)}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A')e.preventDefault();const f=ACT[el.dataset.a];if(f)f(el.dataset.i,el,e)});
function field(e){
 const el=e.target,p=el.dataset&&el.dataset.m;if(!p)return;
 let v=el.type==='checkbox'?el.checked:el.value;
 if(el.dataset.n)v=v===''?(p==='living'?null:''):+v;
 if(el.dataset.l)v=String(v).split(/[,，、\s]+/).map(x=>x.trim()).filter(Boolean);
 if(el.dataset.l&&!v.length)return;
 setP(p.startsWith('imp.')||p.startsWith('sheet.')||p==='q'||p==='rq'?U:S,p,v);
 if(el.dataset.s)save();
 if(el.dataset.fs)U.sheet.o.feeSet=1;
 if(el.dataset.fxm&&e.type==='change'){const v=pAmt(el.value);if(v>0){S.fx={USD:v,d:today(),auto:0};save();render()}return}
 if(el.dataset.pv){const n=$('pctpv');if(n)n.textContent=el.value?'＝ 每月 '+M(planInc()*(+el.value||0)/100):''}
 if(el.dataset.fe||el.dataset.hr){const n=$('feetot');if(n)n.textContent=feeTot(U.sheet.o)}
 if(el.dataset.hr){const n=$('fhrs');if(n)n.textContent=hrsLine(U.sheet.o)}
 if(el.dataset.cn){const n=$('cardnote');if(n)n.innerHTML=cardNote(U.sheet.o)}
 if(el.dataset.fee&&!U.sheet.o.feeSet){const o=U.sheet.o,f=calcFee(o);o.fee=f.fee;o.tax=f.tax;const a=$('tfee'),b=$('ttax');if(a)a.value=f.fee;if(b)b.value=f.tax}
 if(el.dataset.g){const o=U.sheet.o;if(p==='sheet.o.shop'){o.shopSet=!!o.shop;document.querySelectorAll('[data-a="shop"]').forEach(b=>b.classList.toggle('on',b.dataset.i===o.shop))}else if(!o.shopSet&&o.type!=='xfer'){const f=shopFind(o.note);if(f!==(o.shop||'')){o.shop=f;const si=$('fshop');if(si)si.value=f;document.querySelectorAll('[data-a="shop"]').forEach(b=>b.classList.toggle('on',b.dataset.i===f))}}
  if(!o.catSet){const g=guess(o.note+' '+(o.shop||''),o.type);if(g&&g!==o.cat){o.cat=g;document.querySelectorAll('[data-a="cat"]').forEach(b=>b.classList.toggle('on',b.dataset.i===g))}}}
 if(el.dataset.r&&(e.type==='input'||el.tagName==='SELECT'||el.type==='checkbox')){KF=e.type==='input';render()}
}
document.addEventListener('input',e=>{if(e.target.id==='nwq'){NW.kw=e.target.value;NW.lim=40;$('nwl').innerHTML=nwList();return}if(e.target.type!=='checkbox'&&e.target.tagName!=='SELECT'&&!e.target.dataset.l)field(e)});
document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.id==='impf'&&el.files[0]){const f=el.files[0];if(/^image\//.test(f.type)){U.imp.file=f;U.imp.text=''}else if(/\.xlsx?$/i.test(f.name)){toast('請先用 Excel 另存成 CSV 再匯入')}else{U.imp.file=null;U.imp.text=await readFile(f);impParse()}render();return}
 if(el.dataset&&el.dataset.bk){const o=U.sheet.o,k=el.dataset.bk,v=el.value;
  if(v==='__other'){o._other=1;o[k]=BANKS.some(b=>b[1]===o[k])?'':o[k]}else{o._other=0;o[k]=v;const b=BANKS.find(x=>x[1]===v);if(b&&(o.type==='bank'||k==='bank'))o.code=b[0]}
  render();return}
 if(el.dataset&&el.dataset.xi!=null){const x=U.imp.items[+el.dataset.xi],me=U.imp.acct,v=el.value;
  if(v==='out'||v==='in'){x.type=v;x.acct=me;delete x.to;if(!S.cats[v].includes(x.cat))x.cat=guess(x.desc,v)||(v==='in'?'其他收入':'其他')}
  else{const[k,id]=v.split(':');x.type='xfer';x.cat='';if(k==='to'){x.acct=me;x.to=id}else{x.acct=id;x.to=me}}
  render();return}
 if(el.id==='snapf'&&el.files[0]){const f=el.files[0];el.value='';runSnap(f);return}
 if(el.id==='bkf'&&el.files[0]){try{const o=JSON.parse(await readFile(el.files[0])),m=o.money||o;if(!Array.isArray(m.tx)||!Array.isArray(m.accts))throw 0;if(!confirm('用備份檔取代目前全部資料？'))return;S=Object.assign(DEF(),m);save();render();toast('已還原')}catch(x){toast('不是記帳備份檔')}return}
 field(e);
});

// ── 雲端同步：每種資料一個文件，交易紀錄按月份分開 ──
function parts(){
 const o={},by={};
 Object.keys(S).forEach(k=>{if(k!=='tx')o[k]=JSON.stringify(S[k])});
 S.tx.forEach(t=>{(by[t.d.slice(0,7)]=by[t.d.slice(0,7)]||[]).push(t)});
 Object.keys(by).forEach(m=>{o['tx_'+m]=JSON.stringify(by[m])});
 Object.keys(CL.last).forEach(k=>{if(k.startsWith('tx_')&&!(k in o))o[k]='[]'});
 return o;
}
function cloudQ(){if(!CL.col)return;clearTimeout(CL.tm);CL.st='☁︎ 等待同步…';CL.tm=setTimeout(cloudPush,1500)}
async function cloudPush(){
 if(CL.busy){CL.again=1;return}
 CL.busy=1;
 try{
  if(!localStorage.getItem('money-t'))localStorage.setItem('money-t',String(Date.now()));
  const t=+localStorage.getItem('money-t'),o=parts();
  for(const k of Object.keys(o)){const j=o[k];if(j===undefined||j===CL.last[k])continue;if(j.length>900000){CL.st='⚠︎「'+k+'」資料太大，無法同步';continue}await CL.col.doc('m_'+k).set({j});CL.last[k]=j}
  await CL.col.doc('m__meta').set({t});
  CL.st='☁︎ 已同步到雲端 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
 }catch(e){CL.st='⚠︎ 雲端同步失敗，資料仍存在這支手機（'+((e&&e.code)||'錯誤')+'）'}
 CL.busy=0;if(CL.again){CL.again=0;cloudQ()}
}
applyTheme(S.skin,S.mode);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.mode==='auto'){applyTheme(S.skin,S.mode);render()}})}catch(e){}
(async()=>{
 try{
  const db=await claude.use('db'),us=await claude.use('user');
  const uid=us&&await us.id();
  if(!db||!uid){CL.st='⚠︎ 沒有連到雲端（請重新登入），資料只存在這支手機';return}
  CL.col=db.collection('data/users/'+uid);
  const snap=await CL.col.get(),docs={};
  snap.docs.forEach(d=>{if(d.id.startsWith('m_'))docs[d.id]=d.data()});
  const ct=docs.m__meta?(+docs.m__meta.t||0):0,lt=CL.LT0,hasLocal=CL.HAS0;
  if(ct>lt){
   let rl='';try{rl=sessionStorage.getItem('mrl')}catch(e){}
   if(rl!==String(ct)){
    const o={tx:[]};
    try{localStorage.setItem('money-prev',localStorage.getItem('money-v1')||'')}catch(e){}
    Object.keys(docs).forEach(id=>{if(id==='m__meta')return;const k=id.slice(2);try{const v=JSON.parse(docs[id].j);if(k.startsWith('tx_'))o.tx.push(...v);else o[k]=v}catch(e){}});
    localStorage.setItem('money-v1',JSON.stringify(o));localStorage.setItem('money-t',String(ct));
    try{sessionStorage.setItem('mrl',String(ct))}catch(e){}
    location.reload();return}
  }
  Object.keys(docs).forEach(id=>{if(id!=='m__meta')CL.last[id.slice(2)]=docs[id].j});
  if((ct===0&&hasLocal)||lt>ct)cloudPush();else CL.st='☁︎ 已同步到雲端';
  autoBills();
 }catch(e){CL.st='⚠︎ 雲端連線失敗，資料只存在這支手機'}
 if(U.tab==='set')render();
})();
render();autoPx();
</script>
