let DARK=false;
function applyTheme(skin,mode){
 const k=SKINS[skin]?skin:'blue',s=SKINS[k],mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
 DARK=mode==='dark'||(mode!=='light'&&!!(mq&&mq.matches));

// ── 餘額與信用卡帳單 ──
function bal(a){let v=+a.init||0;for(const t of S.tx){if(t.acct===a.id)v+=t.type==='in'?t.amt:-t.amt;if(t.type==='xfer'&&t.to===a.id)v+=t.amt}for(const t of S.trades)if(t.acct===a.id)v+=conv(tradeCash(t),t.cur,a.cur);return v}
// 股票交易對連動帳戶的影響：買進付錢、賣出和股利收錢
const tradeCash=t=>t.type==='buy'?-(t.sh*t.px+(+t.fee||0)):t.type==='sell'?t.sh*t.px-(+t.fee||0)-(+t.tax||0):+t.amt||0;
const liquid=()=>S.accts.filter(a=>!isCard(a)).reduce((s,a)=>s+conv(bal(a),a.cur,'TWD'),0);
// 某天刷卡會在哪天結帳、哪天要繳
function closeOf(c,s){const d=pd(s),k=+c.close||1,cd=ymd(d.getFullYear(),d.getMonth(),k);return s<=cd?cd:ymd(d.getFullYear(),d.getMonth()+1,k)}
function dueOf(c,cl){const d=pd(cl),k=+c.due||1;return ymd(d.getFullYear(),d.getMonth()+(k>(+c.close||1)?0:1),k)}
function nextDue(c,s){const d=pd(s),k=+c.due||1,x=ymd(d.getFullYear(),d.getMonth(),k);return x>=s?x:ymd(d.getFullYear(),d.getMonth()+1,k)}
// 每一期帳單：刷卡、退款歸到所屬帳期，繳款從最舊的帳期開始抵
// 每一期帳單：刷卡、退款依「入帳日」（還沒入帳就用消費日）歸到帳期；繳款依日期從最舊的帳期開始抵，抵完的帳期記下繳清日
let CI={};
function cardInfo(c){
 if(CI[c.id])return CI[c.id];
 const b={},pays=[],add=(k,due,v,t)=>{const x=b[k]=b[k]||{close:k,due,amt:0,tx:[]};x.amt+=v;if(t)x.tx.push(t)};
 if(+c.init)add('init',nextDue(c,c.since||today()),+c.init);
 if(c.start&&+c.cur0){const k=closeOf(c,c.start);add(k,dueOf(c,k),+c.cur0)}
 for(const t of S.tx){
  if(c.start&&(t.acct===c.id?t.pd||t.d:t.d)<c.start)continue;
  if(t.acct===c.id){const k=closeOf(c,t.pd||t.d);add(k,dueOf(c,k),t.type==='in'?-t.amt:t.amt,t)}
  else if(t.type==='xfer'&&t.to===c.id)pays.push({d:t.d,v:t.amt})}
 const st=Object.values(b).sort((x,y)=>x.due<y.due?-1:x.due>y.due?1:0);
 st.forEach(s=>{if(s.amt<0){pays.push({d:s.close==='init'?'':s.close,v:-s.amt});s.amt=0}s.left=s.amt});
 pays.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
 let i=0,credit=0;
 for(const p of pays){let v=p.v;while(v>0.005&&i<st.length){const s=st[i];if(s.left<=0.005){i++;continue}const x=Math.min(v,s.left);s.left-=x;v-=x;if(s.left<=0.005){s.left=0;s.paid=p.d;i++}}credit+=v}
 const open=st.filter(s=>s.left>0.5),t0=today(),cur=closeOf(c,t0),by={};st.forEach(s=>{by[s.close]=s});
 const billed=open.filter(s=>s.close==='init'||s.close<t0);
 return CI[c.id]={st,by,open,billed,owe:open.reduce((x,s)=>x+s.left,0),cur,curAmt:(by[cur]||{amt:0}).amt,credit};
}
// 一筆刷卡現在在哪個階段：未入帳 → 未出帳 → 已出帳待繳 → 已繳清
function txStatus(t){
 const c=A(t.acct);if(!isCard(c)||t.type==='xfer')return null;
 if(c.start&&(t.pd||t.d)<c.start)return{k:'pre',txt:'開始記帳前',close:closeOf(c,t.pd||t.d),s:{}};
 const k=closeOf(c,t.pd||t.d),s=cardInfo(c).by[k]||{due:dueOf(c,k),left:1,amt:1},t0=today();
 if(s.amt>0&&s.left<=0.5)return{k:'paid',txt:'✓ 已繳清'+(s.paid?' '+md(s.paid):''),close:k,s};
 if(k<t0)return{k:'billed',txt:'● 已出帳・'+md(s.due)+(s.due<t0?' 已過繳款日':' 前繳'),close:k,s};
 if(!t.pd)return{k:'pending',txt:'… 未入帳',close:k,s,edge:dleft(k)<=3};
 return{k:'open',txt:'○ 未出帳・'+md(k)+' 結帳',close:k,s};
}
const stPill=t=>{const x=txStatus(t);return x?`<span class="st ${x.k}">${x.txt}</span>`:''};
// 帳單在 end 之前的每一次到期日
function occ(b,end){const r=[];let s=b.next,n=0;while(s&&s<=end&&(!b.end||s<=b.end)&&n++<600){r.push(s);if(!+b.freq)break;s=addM(s,+b.freq,b.day)}return r}
function livingAuto(){
 const t0=today(),from=shiftD(t0,-90),bc=new Set(S.bills.filter(b=>b.kind!=='in').map(b=>b.cat));
 const xs=S.tx.filter(t=>t.type==='out'&&!t.bill&&t.d>=from&&t.d<=t0&&!bc.has(t.cat));
 if(!xs.length)return 0;
 const first=xs.reduce((m,t)=>t.d<m?t.d:m,t0),days=Math.max(30,Math.min(90,1-dleft(first)));
 return xs.reduce((s,t)=>s+t.amt,0)/days*30.4;
}
const living=()=>S.living==null||S.living===''?livingAuto():+S.living||0;
// 未來 H 天的現金流：信用卡帳單、固定帳單、收入，以及每天的日常花費
function forecast(H){
 const t0=today(),end=shiftD(t0,H),ev=[];
 S.accts.filter(isCard).forEach(c=>cardInfo(c).open.forEach(s=>{if(s.due<=end)ev.push({d:s.due<t0?t0:s.due,late:s.due<t0,amt:-s.left,name:c.name+' 帳單',sub:s.close==='init'?'期初未繳':md(s.close)+' 結帳'+(s.close>=t0?'（還在累積）':''),k:'card'})}));
 S.bills.forEach(b=>occ(b,end).forEach(o=>{
  const a=A(b.acct),inc=b.kind==='in';
  if(isCard(a)&&!inc){const due=dueOf(a,closeOf(a,o));if(due<=end)ev.push({d:due<t0?t0:due,late:due<t0,amt:-b.amt,name:b.name,sub:md(o)+' 刷 '+a.name+'，跟著卡費繳',k:'bill'})}
  else ev.push({d:o<t0?t0:o,late:o<t0,amt:(inc?1:-1)*conv(+b.amt,bcur(b),'TWD'),name:b.name,sub:(b.kind==='inv'?'定期投資・':'')+nm(a)+(b.auto?' 自動扣繳':''),k:inc?'inc':'bill'})}));
 ev.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:x.amt-y.amt);
 const liq=liquid(),daily=living()/30.4;let cum=0,min=liq,minD=t0;
 ev.forEach(e=>{cum+=e.amt;e.run=liq+cum-daily*dleft(e.d);if(e.run<min){min=e.run;minD=e.d}});
 const endRun=liq+cum-daily*H;if(endRun<min){min=endRun;minD=end}
 const sum=k=>-ev.filter(e=>e.k===k).reduce((s,e)=>s+e.amt,0);
 const bill=sum('bill'),card=sum('card'),liv=daily*H;
 return{ev,min,minD,bill,card,liv,inc:-sum('inc'),need:bill+card+liv,liq};
}

}

function vCalc(){
 const c=S.calc,r=(+c.r||0)/1200,Y=Math.max(1,Math.min(60,Math.floor(+c.y||0))),n=Y*12,P=+c.p||0,C=+c.c||0,G=+c.goal||0;

 <h2>每年的變化</h2><div class="card"><table class="pv"><tr><th>年</th><th style="text-align:right">自己投入</th><th style="text-align:right">總金額</th><th style="text-align:right">多賺的</th></tr>${pts.filter(p=>p.x&&(Y<=20||p.x%5===0||p.x===Y)).map(p=>`<tr><td>${p.x}</td><td class="num" style="text-align:right">${M(p.b)}</td><td class="num" style="text-align:right">${M(p.a)}</td><td class="num" style="text-align:right">${M(p.a-p.b)}</td></tr>`).join('')}</table></div>`;

// ── 匯入解析 ──
function pDate(s){
 s=String(s||'').trim();let m,y,mo,d;
 if(m=s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/))[y,mo,d]=[+m[1],+m[2],+m[3]];
 else if(m=s.match(/^(\d{2,3})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/))[y,mo,d]=[+m[1]+1911,+m[2],+m[3]];
 else if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/))[y,mo,d]=[+m[1],+m[2],+m[3]];
 else if(m=s.match(/^(\d{3})(\d{2})(\d{2})$/))[y,mo,d]=[+m[1]+1911,+m[2],+m[3]];
 else if(m=s.match(/^(\d{1,2})[\/\-月](\d{1,2})日?$/)){y=new Date().getFullYear();mo=+m[1];d=+m[2];if(mo>=1&&mo<=12&&dleft(iso(new Date(y,mo-1,d)))>31)y--}
 else return '';
 if(mo<1||mo>12||d<1||d>dim(y,mo-1)||y<1990||y>2100)return '';
 return iso(new Date(y,mo-1,d));
}
function pAmt(s){
 s=String(s==null?'':s).trim();if(!s)return NaN;let neg=false;
 if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
 s=s.replace(/NT\$?|TWD|\$|＄|元|,|，|\s/gi,'');
 if(/-$/.test(s)){neg=!neg;s=s.slice(0,-1)}
 if(!/^[-+]?\d+(\.\d+)?$/.test(s))return NaN;
 const v=parseFloat(s);return neg?-v:v;
}
function csv(text){
 const head=text.split(/\r?\n/).slice(0,30).join('\n');
 const sep=[',','\t',';','|'].map(s=>[s,head.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
  else cur+=ch}
 if(cur||row.length){row.push(cur);rows.push(row)}
 return rows.map(r=>r.map(c=>c.replace(/^﻿/,'').trim().replace(/^="?|"$/g,'').trim())).filter(r=>r.some(c=>c));
}
// 財政部電子發票「載具消費明細」CSV：M|載具名稱|載具號碼|發票日期|商店統編|商店店名|發票號碼|總金額|發票狀態 、D|發票號碼|小計|品項名稱
function parseEinv(text){
 const inv={},out=[];
 text.split(/\r?\n/).forEach(ln=>{ln=ln.replace(/^﻿/,'').trim();if(!ln)return;
  const f=ln.split(ln.includes('|')?'|':',').map(x=>x.trim().replace(/^"|"$/g,''));
  if(f[0]==='M'){if(/作廢|折讓/.test(f[8]||''))return;const d=pDate(f[3]),a=pAmt(f[7]);if(!d||isNaN(a))return;inv[f[6]]={d,shop:f[5],amt:a,items:[]};out.push(inv[f[6]])}
  else if(f[0]==='D'&&inv[f[1]])inv[f[1]].items.push(f[3])});
 return out;
}
function guessMap(R){
 const n=Math.max(...R.map(r=>r.length)),js=Array.from({length:n},(_,j)=>j);
 const di=js.map(j=>[j,R.filter(r=>pDate(r[j])).length]).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0][0];
 const data=R.filter(r=>pDate(r[di])),hi=R.indexOf(data[0])-1,H=j=>(hi>=0&&R[hi][j])||'';
 const nums=js.filter(j=>{if(j===di)return false;const ne=data.filter(r=>r[j]).length,k=data.filter(r=>r[j]&&!isNaN(pAmt(r[j]))&&!pDate(r[j])).length;return k>0&&k>=ne*0.8&&!/卡號|帳號|編號|序號|末四|外幣|幣別/.test(H(j))});
 let ai=nums.find(j=>/支出|提款|扣款|消費|台幣|臺幣|入帳金額|金額/.test(H(j))&&!/外幣|餘額|存入|收入/.test(H(j)));
 if(ai==null)ai=nums.find(j=>!/餘額|存入|收入/.test(H(j)));
 const ii=nums.find(j=>j!==ai&&/存入|收入|轉入/.test(H(j)));
 const avg=j=>data.reduce((s,r)=>s+(r[j]||'').length,0)/(data.length||1);
 const tj=js.filter(j=>j!==di&&!nums.includes(j)&&!pDate((data[0]||[])[j])).sort((a,b)=>avg(b)-avg(a))[0];
 const dcs=js.filter(j=>j!==di&&data.filter(r=>pDate(r[j])).length>=data.length/2),pj=dcs.find(j=>/入帳|記帳|過帳/.test(H(j)))??dcs[0];
 return{d:di,a:ai==null?-1:ai,i:ii==null?-1:ii,t:tj==null?di:tj,p:pj==null?-1:pj,h:hi};
}
function buildRows(){

 I.rows.forEach(r=>{const d=pDate(r[m.d]);if(!d)return;

async function nwLoadNews(){try{const r=await fetch('news.json?t='+Math.floor(Date.now()/300000),{cache:'no-cache'});if(r.ok){NW.n=await r.json();NW.nAt=Date.now()}}catch(e){}}
async function nwLoadTW(){
 const m={};
 await Promise.all(PXSRC.map(async([u,kc,kp])=>{try{const r=await fetch(u);if(!r.ok)return;const js=await r.json();if(!Array.isArray(js))return;
  for(const x of js){const c=String(x[kc]||'').trim().toUpperCase(),p=nwNum(x[kp]),ch=nwNum(x.Change);if(!c||!(p>0))continue;
   m[c]={name:String(x.Name||x.CompanyName||'').trim(),p,prev:isFinite(ch)?p-ch:null,d:nwRoc(x.Date),src:'收盤'}}}catch(e){}}));
 if(Object.keys(m).length)NW.tw=m;
}
async function nwUS(sym){
 const h=NW.n&&NW.n.us&&NW.n.us[sym];if(h)return{p:h.p,prev:h.prev,d:h.t?iso(new Date(h.t*1000)):'',src:'報價'};
 const r=await usPrice(sym);return r?{p:r.p,prev:null,d:r.d,src:'報價'}:null;

async function nwLoadQuotes(force){
 const rs=nwRows();if(force)NW.tw=null;
 if(rs.some(r=>r.cur!=='USD')&&!NW.tw)await nwLoadTW();
 const us=rs.filter(r=>r.cur==='USD'),got=await Promise.all(us.map(r=>nwUS(r.sym))),q={};
 rs.forEach(r=>{if(r.cur!=='USD'&&NW.tw&&NW.tw[r.sym])q[r.sym]=NW.tw[r.sym]});
 us.forEach((r,i)=>{if(got[i])q[r.sym]=got[i]});
 // 抓不到的用記帳裡存的最後股價（沒有漲跌）
 rs.forEach(r=>{const p=S.prices[r.sym];if(!q[r.sym]&&p)q[r.sym]={p:+p.p,prev:null,d:p.d||'',src:'記帳裡的'}});
 NW.q=q;NW.qAt=Date.now();
}
async function nwLoad(force){

const nwFx=()=>{const m=NW.n&&NW.n.markets&&NW.n.markets.find(x=>x.sym==='TWD=X');return m&&m.p>10?m.p:rate('USD')};
function nwSpark(a,up){
 if(!a||a.length<2)return'';const lo=Math.min(...a),hi=Math.max(...a),w=120,h=26,rg=hi-lo||1,pts=a.map((v,i)=>[i/(a.length-1)*w,h-2-(v-lo)/rg*(h-4)]);
 const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(''),c=up?'var(--up)':'var(--down)';
 return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${w},${h}L0,${h}Z" fill="${c}" opacity=".12"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function nwStocks(){
 const rs=nwRows();
 if(!rs.length)return`<div class="card sub">還沒有持股。到「更多 → 股票」記錄買進，這裡就會顯示每天的漲跌；也可以先在下面加自選股。${nwAddForm()}</div>`;
 const own=rs.filter(r=>!r.watch);let val=0,day=0,cost=0,okd=0,up=0,dn=0;
 const tw=(v,c)=>c==='USD'?v*nwFx():v;
 own.forEach(r=>{const q=NW.q[r.sym];if(!q)return;val+=tw(r.sh*q.p,r.cur);cost+=tw(r.cost,r.cur);if(q.prev){day+=tw(r.sh*(q.p-q.prev),r.cur);okd++;if(q.p>q.prev)up++;else if(q.p<q.prev)dn++}});
 const big=(v,ok)=>ok?(HIDE?'$ ••••':nwSg(v)+M(Math.abs(v))):'—';
 let h='<div class="card">';
 if(own.length)h+=`<div class="nw-sum"><div><div class="sub">今天持股漲跌</div><div class="big ${nwCls(day)}">${big(day,okd)}</div></div>
  <div><div class="sub">漲跌幅</div><b class="num ${nwCls(day)}">${okd&&val-day>0?nwPct(day/(val-day)):'—'}</b></div>
  <div><div class="sub">市值</div><b class="num">${val?M(val):'—'}</b></div>
  <div><div class="sub">還沒賣的賺賠</div><b class="num ${nwCls(val-cost)}">${big(val-cost,val&&cost)}</b></div></div>
  <div class="sub" style="margin:4px 0 2px">${up} 檔漲、${dn} 檔跌${own.some(r=>r.cur==='USD')?'・美股以 1 美元 = '+nwFx().toFixed(2)+' 台幣換算':''}</div>`;
 const chg=r=>{const q=NW.q[r.sym];return q&&q.prev?q.p/q.prev-1:0};
 h+=rs.slice().sort((a,b)=>(a.watch?1:0)-(b.watch?1:0)||Math.abs(chg(b))-Math.abs(chg(a))).map(r=>{
  const q=NW.q[r.sym],d=q&&q.prev?q.p-q.prev:null,name=r.name||(q&&q.name)||'';
  const yu=r.cur==='USD'?`https://finance.yahoo.com/quote/${encodeURIComponent(r.sym)}/news`:`https://tw.stock.yahoo.com/quote/${encodeURIComponent(r.sym)}/news`;
  const gu=`https://news.google.com/search?q=${encodeURIComponent((name||r.sym)+(r.cur==='USD'?' stock':' 股'))}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
  const dv=d==null?'':`・今天 <span class="${nwCls(d)}">${HIDE?'••••':nwSg(d)+(r.cur==='USD'?'US$'+Math.abs(r.sh*d).toFixed(2):'$'+Math.round(Math.abs(r.sh*d)).toLocaleString('zh-TW'))}</span>`;
  return`<div class="nw-st"><div style="min-width:0"><b>${E(r.sym)}</b> ${E(name)}${r.cur==='USD'?' <span class="pill">美股</span>':''}${r.watch?' <span class="pill">自選</span>':''}
   <div class="sub">${r.watch?'沒有持股':+r.sh.toFixed(4)+' 股'+dv}${q&&q.d?'・'+md(q.d)+' '+q.src:''}</div></div>
   <div class="num" style="text-align:right">${q?nwPx(q.p,r.cur):'—'}<div class="sub ${nwCls(d)}">${d!=null?nwSg(d)+Math.abs(d).toFixed(2):q?'沒有漲跌':'抓不到'}</div></div>
   <span class="nw-badge ${nwCls(d)}">${nwPct(q&&q.prev?q.p/q.prev-1:null)}</span>
   <div class="nw-links"><a href="${yu}" target="_blank" rel="noopener">Yahoo 股市新聞 ↗</a><a href="${gu}" target="_blank" rel="noopener">Google 新聞 ↗</a>${r.watch?`<button data-a="nwunwatch" data-i="${E(r.sym)}">移除自選</button>`:''}</div></div>`}).join('');
 return h+nwAddForm()+`<div class="sub" style="margin-top:6px">${NW.qAt?'股價更新於 '+nwHM(new Date(NW.qAt))+'・':''}台股是證交所／櫃買中心的收盤價（盤中請點 Yahoo 看即時）；美股每小時更新。紅漲綠跌。</div></div>`;
}

function payBill(b,skip){
 if(!skip&&b.kind==='inv'){
  const v=prompt(`${b.name}（${b.sym}）這期扣了多少${b.cur==='USD'?'美元':'錢'}？`,b.amt);if(v===null)return;const n=pAmt(v);if(!(n>0))return toast('金額不正確');
  const q=prompt('這期買到幾股？（看券商的成交通知）');if(q===null)return;const sh=pAmt(q);if(!(sh>0))return toast('股數不正確');
  S.trades.push(Object.assign({id:nid(),d:b.next<=today()?b.next:today(),type:'buy',sym:b.sym,name:b.sname||'',sh,px:n/sh,fee:0,acct:b.acct,src:'plan',ts:Date.now()},b.cur==='USD'?{cur:'USD'}:{}));
 }else if(!skip){
  const v=prompt(`${b.name} 這期實際金額`,b.amt);if(v===null)return;const n=pAmt(v);if(!(n>0))return toast('金額不正確');
  const d=b.next<=today()?b.next:today();
  S.tx.push({id:nid(),d,type:b.kind==='in'?'in':'out',amt:n,acct:b.acct,cat:b.cat,note:b.name,bill:b.id,src:'m',ts:Date.now()});
 }
 if(+b.freq)b.next=addM(b.next,+b.freq,b.day);
 const last=!+b.freq||(b.end&&b.next>b.end);if(last)S.bills=S.bills.filter(x=>x!==b);
 save();render();toast((skip?'已略過這期':b.kind==='inv'?'已記到股票':'已記錄')+'，'+(last?'這是最後一期了':'下次 '+md(b.next)));
}

 const o={},by={};
 Object.keys(S).forEach(k=>{if(k!=='tx')o[k]=JSON.stringify(S[k])});
 S.tx.forEach(t=>{(by[t.d.slice(0,7)]=by[t.d.slice(0,7)]||[]).push(t)});
 Object.keys(by).forEach(m=>{o['tx_'+m]=JSON.stringify(by[m])});
 Object.keys(CL.last).forEach(k=>{if(k.startsWith('tx_')&&!(k in o))o[k]='[]'});
 return o;
}
function cloudQ(){if(!CL.col)return;clearTimeout(CL.tm);CL.st='☁︎ 等待同步…';CL.tm=setTimeout(cloudPush,1500)}
async function cloudPush(){
 if(CL.busy){CL.again=1;return}
 CL.busy=1;
 try{
  if(!localStorage.getItem('money-t'))localStorage.setItem('money-t',String(Date.now()));
  const t=+localStorage.getItem('money-t'),o=parts();
  for(const k of Object.keys(o)){const j=o[k];if(j===undefined||j===CL.last[k])continue;if(j.length>900000){CL.st='⚠︎「'+k+'」資料太大，無法同步';continue}await CL.col.doc('m_'+k).set({j});CL.last[k]=j}
  await CL.col.doc('m__meta').set({t});
  CL.st='☁︎ 已同步到雲端 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
 }catch(e){CL.st='⚠︎ 雲端同步失敗，資料仍存在這支手機（'+((e&&e.code)||'錯誤')+'）'}
 CL.busy=0;if(CL.again){CL.again=0;cloudQ()}
}
applyTheme(S.skin,S.mode);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.mode==='auto'){applyTheme(S.skin,S.mode);render()}})}catch(e){}
(async()=>{
 try{
  const db=await claude.use('db'),us=await claude.use('user');
  const uid=us&&await us.id();
  if(!db||!uid){CL.st='⚠︎ 沒有連到雲端（請重新登入），資料只存在這支手機';return}
  CL.col=db.collection('data/users/'+uid);
  const snap=await CL.col.get(),docs={};
  snap.docs.forEach(d=>{if(d.id.startsWith('m_'))docs[d.id]=d.data()});
  const ct=docs.m__meta?(+docs.m__meta.t||0):0,lt=CL.LT0,hasLocal=CL.HAS0;
  if(ct>lt){
   let rl='';try{rl=sessionStorage.getItem('mrl')}catch(e){}
   if(rl!==String(ct)){
    const o={tx:[]};
    try{localStorage.setItem('money-prev',localStorage.getItem('money-v1')||'')}catch(e){}
    Object.keys(docs).forEach(id=>{if(id==='m__meta')return;const k=id.slice(2);try{const v=JSON.parse(docs[id].j);if(k.startsWith('tx_'))o.tx.push(...v);else o[k]=v}catch(e){}});
    localStorage.setItem('money-v1',JSON.stringify(o));localStorage.setItem('money-t',String(ct));
    try{sessionStorage.setItem('mrl',String(ct))}catch(e){}
    location.reload();return}
  }
  Object.keys(docs).forEach(id=>{if(id!=='m__meta')CL.last[id.slice(2)]=docs[id].j});
  if((ct===0&&hasLocal)||lt>ct)cloudPush();else CL.st='☁︎ 已同步到雲端';
 }catch(e){CL.st='⚠︎ 雲端連線失敗，資料只存在這支手機'}
 if(U.tab==='set')render();
})();
render();autoPx();
</script>
